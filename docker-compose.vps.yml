name: rgnfarmasystem

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: core.settings.production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  DB_DEPLOYMENT: container
  DB_HOST: db
  DB_PORT: 5432

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rgnfarmasystem:${IMAGE_TAG:-vps}
    restart: unless-stopped
    expose:
      - "8000"
    env_file: ["${VPS_ENV_FILE:-.env}"]
    environment: *app-environment
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./deploy/nginx/rgnfarmasystem.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro
      - staticfiles:/var/www/static:ro
    networks: [backend]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    image: rgnfarmasystem:${IMAGE_TAG:-vps}
    restart: unless-stopped
    entrypoint: ["/app/worker-entrypoint.sh"]
    command: ["celery", "-A", "core", "worker", "-l", "INFO", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    env_file: ["${VPS_ENV_FILE:-.env}"]
    environment: *app-environment
    volumes: [media:/app/media]
    networks: [backend]
    depends_on:
      app: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping --destination celery@$$(hostname) --timeout=5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  celery_beat:
    image: rgnfarmasystem:${IMAGE_TAG:-vps}
    restart: unless-stopped
    entrypoint: ["/app/worker-entrypoint.sh"]
    command: ["celery", "-A", "core", "beat", "-l", "INFO", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    env_file: ["${VPS_ENV_FILE:-.env}"]
    environment: *app-environment
    networks: [backend]
    depends_on:
      app: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib,sys; commands=[' '.join(path.read_text(errors='ignore').split('\\0')) for path in pathlib.Path('/proc').glob('[0-9]*/cmdline')]; sys.exit(0 if any('celery' in command and 'beat' in command for command in commands) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [backend]
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup_scheduler:
    image: rgnfarmasystem:${IMAGE_TAG:-vps}
    restart: unless-stopped
    entrypoint: ["/app/scripts/backup_scheduler.sh"]
    env_file: ["${VPS_ENV_FILE:-.env}"]
    environment:
      <<: *app-environment
      DB_DEPLOYMENT: external
      MEDIA_DEPLOYMENT: external
      MEDIA_DIR: /app/media
      BACKUP_DIR: /var/backups/rgnfarmasystem
      LOG_DIR: /var/backups/rgnfarmasystem/logs
    volumes:
      - media:/app/media:ro
      - backups:/var/backups/rgnfarmasystem
    networks: [backend]
    depends_on:
      app: {condition: service_healthy}
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/backup_scheduler_ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "${CLOUDFLARED_METRICS_ADDRESS:-127.0.0.1:20249}", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    network_mode: host
    extra_hosts:
      - "nginx:127.0.0.1"
    depends_on:
      nginx: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "${CLOUDFLARED_METRICS_ADDRESS:-127.0.0.1:20249}", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  media:
  staticfiles:
  backups:
