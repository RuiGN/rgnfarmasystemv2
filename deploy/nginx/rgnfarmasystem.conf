server {
    listen 80;
    server_name _;
    # DNS interno do Docker, reconsultado em tempo de execucao. Um bloco upstream
    # fixo resolve o nome uma unica vez na inicializacao e congela o IP do app:
    # todo release que recria o container responde 502 ate o nginx ser reiniciado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;
    location /static/ { alias /var/www/static/; expires 7d; add_header Cache-Control "public, immutable"; }
    location ^~ /media/protected/ { return 404; }
    location /media/ { alias /var/www/media/; expires 1h; add_header X-Content-Type-Options nosniff; }
    location / {
        set $upstream_app app:8000;
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS before reaching the internal HTTP origin.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
