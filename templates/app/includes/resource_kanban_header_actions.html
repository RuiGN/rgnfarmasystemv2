<a href="{% url 'app:resource_list' module.slug resource.slug %}" class="btn btn-sm btn-light-brand d-inline-flex align-items-center gap-2">
    <i class="feather-list" aria-hidden="true"></i>
    <span>Ver lista</span>
</a>
{% if can_add %}
<a href="{% url 'app:resource_create' module.slug resource.slug %}" class="btn btn-sm btn-primary d-inline-flex align-items-center gap-2">
    <i class="feather-plus" aria-hidden="true"></i>
    <span>Novo registro</span>
</a>
{% endif %}
