<section class="card" data-ui="detail-summary" aria-label="Resumo operacional">
    <div class="card-header">
        <div class="d-flex align-items-center gap-2">
            <i class="feather-sidebar" aria-hidden="true"></i>
            <h2 class="h6 mb-0">Resumo operacional</h2>
        </div>
    </div>
    <dl class="card-body detail-summary__list mb-0">
        {% for item in detail_summary %}
        <div class="detail-summary__item">
            <dt class="detail-summary__label">
                <i class="{{ item.icon }}" aria-hidden="true"></i>
                {{ item.label|capfirst }}
            </dt>
            <dd class="detail-summary__value mb-0">
                {% if item.is_status %}
                {% include 'includes/components/status_badge.html' with status=item.status %}
                {% else %}
                {{ item.value }}
                {% endif %}
            </dd>
        </div>
        {% endfor %}
    </dl>
</section>
