name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, gxp-validation-program]

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rgn_test
          POSTGRES_PASSWORD: rgn_test
          POSTGRES_DB: rgn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rgn_test -d rgn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "su-exec rabbitmq rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rgn_test:rgn_test@127.0.0.1:5432/rgn_test
      DATABASE_URL: postgresql://rgn_test:rgn_test@127.0.0.1:5432/rgn_test
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: amqp://guest:guest@127.0.0.1:5672//
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-only-non-production-secret-key-with-adequate-length
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://app.example.invalid
      CONTROL_PLANE_BASE_URL: https://control.example.invalid
      CUSTOMER_APP_BASE_URL: https://app.example.invalid
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SECURE_HSTS_SECONDS: "31536000"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      SECURE_HSTS_PRELOAD: "True"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: pip install --requirement requirements-dev.txt
      - name: Run quality gate
        run: bash scripts/ci/quality-gate.sh
      - name: Build immutable candidate image
        run: docker build --tag rgnfarmasystem:${{ github.sha }} .
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: rgnfarmasystem:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            coverage.xml
            openapi-schema.yml
            sbom.cdx.json
